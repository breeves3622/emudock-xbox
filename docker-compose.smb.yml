version: "3.8"

services:
  sunshine:
    image: ghcr.io/lizardbyte/sunshine:latest-ubuntu-22.04
    container_name: sunshine-emulator-stack
    restart: unless-stopped
    privileged: true
    user: "0:0"
    network_mode: host
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-America/New_York}
      - SUNSHINE_USER=${SUNSHINE_USER:-admin}
      - SUNSHINE_PASS=${SUNSHINE_PASS:-admin123}
      - SUNSHINE_CONFIG_DIR=/config
      - DISPLAY=:0
    volumes:
      - sunshine-config:/config
      - sunshine-config:/home/lizard/.config/sunshine
      - ./config/es-de:/home/sunshine/.emulationstation
      - smb-roms-storage:/roms
      - smb-bios-storage:/bios
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      - /dev/input:/dev/input
    shm_size: "2gb"

volumes:
  sunshine-config:
    name: sunshine_config
  smb-roms-storage:
    name: smb_emulator_roms
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER:-guest},password=${SMB_PASS:-},guest,uid=0,gid=0,vers=3.0"
      device: "${SMB_ROMS_PATH:-//10.80.1.50/Public/Emulator/Roms}"

  smb-bios-storage:
    name: smb_emulator_bios
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER:-guest},password=${SMB_PASS:-},guest,uid=0,gid=0,vers=3.0"
      device: "${SMB_BIOS_PATH:-//10.80.1.50/Public/Emulator/Roms/bios}"
