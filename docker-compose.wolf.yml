version: "3.8"

services:
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: wolf-emulator-stack
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - WOLF_RENDER_NODE=/dev/dri/renderD128
      - WOLF_ENCODER_NODE=/dev/dri/renderD128
    volumes:
      - ./config/wolf:/etc/wolf
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
      - smb-roms-storage:/roms
    device_cgroup_rules:
      - 'c 13:* rmw'
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid

volumes:
  smb-roms-storage:
    name: smb_emulator_roms
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASS},domain=${SMB_DOMAIN:-WORKGROUP},uid=1000,gid=1000,vers=3.0"
      device: "${SMB_ROMS_PATH}"
