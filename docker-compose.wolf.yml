version: "3.8"

services:
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: wolf-emulator-stack
    network_mode: host
    restart: unless-stopped
    privileged: true
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-America/New_York}
      - WOLF_RENDER_NODE=/dev/dri/renderD128
      - WOLF_ENCODER_NODE=/dev/dri/renderD128
      - WOLF_SOCKET_PATH=/var/run/wolf/wolf.sock
    volumes:
      - wolf-config:/etc/wolf
      - /var/run/wolf:/var/run/wolf
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
      - smb-roms-storage:/roms
    device_cgroup_rules:
      - 'c 13:* rmw'
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid

  wolf-den:
    image: ghcr.io/games-on-whales/wolf-den:stable
    container_name: wolf-den-ui
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    environment:
      - WOLF_SOCKET_PATH=/var/run/wolf/wolf.sock
      - ASPNETCORE_URLS=http://+:8085
      - ASPNETCORE_HTTP_PORTS=8085
      - PORT=8085
    volumes:
      - wolf-config:/etc/wolf
      - /var/run/wolf:/var/run/wolf
      - /var/run/docker.sock:/var/run/docker.sock:rw

volumes:
  wolf-config:
    name: wolf_config
  smb-roms-storage:
    name: smb_emulator_roms
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER:-guest},password=${SMB_PASS:-},guest,uid=0,gid=0,vers=3.0"
      device: "${SMB_ROMS_PATH:-//10.80.1.50/Public/Emulator/Roms}"
