version: "3.8"

services:
  sunshine:
    image: ghcr.io/lizardbyte/sunshine:latest-ubuntu-22.04
    container_name: sunshine-emulator-stack
    restart: unless-stopped
    privileged: true
    user: "0:0"
    network_mode: host
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-America/New_York}
      - SUNSHINE_USER=${SUNSHINE_USER:-admin}
      - SUNSHINE_PASS=${SUNSHINE_PASS:-admin123}
      - SUNSHINE_CONFIG_DIR=/config
      - DISPLAY=:0
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
    volumes:
      - sunshine-config:/config
      - sunshine-config:/home/lizard/.config/sunshine
      - ./config/es-de:/home/sunshine/.emulationstation
      - roms-storage:/roms
      - bios-storage:/bios
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/dri:/dev/dri # Intel/AMD integrated or dedicated GPU
      - /dev/uinput:/dev/uinput # Controller input forwarding
      - /dev/input:/dev/input # Input devices
    shm_size: "2gb"

volumes:
  sunshine-config:
    name: sunshine_config
  roms-storage:
    name: emulator_roms
  bios-storage:
    name: emulator_bios
