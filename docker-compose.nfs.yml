version: "3.8"

services:
  sunshine:
    image: ghcr.io/lizardbyte/sunshine:latest-ubuntu-22.04
    container_name: sunshine-emulator-stack
    restart: unless-stopped
    privileged: true
    user: "0:0"
    network_mode: host
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-America/New_York}
      - SUNSHINE_USER=${SUNSHINE_USER:-admin}
      - SUNSHINE_PASS=${SUNSHINE_PASS:-admin123}
      - SUNSHINE_CONFIG_DIR=/config
      - DISPLAY=:0
    volumes:
      - sunshine-config:/config
      - sunshine-config:/home/lizard/.config/sunshine
      - ./config/es-de:/home/sunshine/.emulationstation
      - nfs-roms-storage:/roms
      - nfs-bios-storage:/bios
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      - /dev/input:/dev/input
    shm_size: "2gb"

volumes:
  sunshine-config:
    name: sunshine_config
  nfs-roms-storage:
    name: nfs_emulator_roms
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER_IP},rw,soft,nolock,timeo=30"
      device: ":${NFS_ROMS_PATH}"

  nfs-bios-storage:
    name: nfs_emulator_bios
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER_IP},rw,soft,nolock,timeo=30"
      device: ":${NFS_BIOS_PATH}"
